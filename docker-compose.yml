# Base (produção). Toda a configuração vem do .env (modelo em .env.example).
# Só o frontend publica porta; o backend fica acessível apenas pela rede interna (nginx -> backend:3001).
services:
  backend:
    build: ./backend
    container_name: endpoint-manager-api
    env_file: .env
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: endpoint-manager-ui
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
