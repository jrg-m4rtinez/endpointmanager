# Lab local: Postgres próprio + Keycloak (no papel do Entra ID).
# Uso: docker compose -f docker-compose.yml -f docker-compose.lab.yml up -d --build
services:
  db:
    image: postgres:16-alpine
    container_name: endpoint-manager-lab-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - em_lab_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: endpoint-manager-lab-keycloak
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://host.docker.internal:8082
      KC_HTTP_PORT: 8080
    ports:
      - "8082:8080"
    volumes:
      - ./lab/keycloak:/opt/keycloak/data/import:ro
    restart: unless-stopped

  backend:
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  em_lab_pg:
